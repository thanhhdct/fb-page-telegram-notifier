# Meta không gửi webhook khi view tăng — repo tự gọi API quét mốc view trên Vercel.
# Lịch: 7:00–12:00 Asia/Ho_Chi_Minh, mỗi 30 phút (cron dưới dùng UTC).
# Variables: PUBLIC_BASE_URL (Settings → Variables → Actions).
# Secrets: CRON_SECRET (Settings → Secrets → Actions, giống trên Vercel).

name: Scan view milestones

on:
  schedule:
    # Giờ VN 7:00–11:30, mỗi 30 phút (UTC+7 → 0–4h UTC).
    - cron: '0,30 0-4 * * *'
    # 12:00 giờ VN (05:00 UTC).
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: check-views
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/check-views
        env:
          APP_URL: ${{ vars.PUBLIC_BASE_URL || secrets.PUBLIC_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Thiếu PUBLIC_BASE_URL (Variables hoặc Secrets) hoặc CRON_SECRET (Secrets)."
            exit 1
          fi
          base="${APP_URL%/}"
          curl -fsS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${base}/api/cron/check-views"