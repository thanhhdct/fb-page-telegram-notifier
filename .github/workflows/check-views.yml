# Meta không gửi webhook khi view tăng — repo tự gọi API quét mốc view trên Vercel.
# Secrets (Settings → Secrets → Actions): PUBLIC_BASE_URL, CRON_SECRET (giống trên Vercel).

name: Scan view milestones

on:
  schedule:
    # GitHub Actions: tối thiểu ~5 phút; lịch thực tế có thể trễ vài phút.
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: check-views
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/check-views
        env:
          APP_URL: ${{ secrets.PUBLIC_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Thiếu GitHub secret PUBLIC_BASE_URL hoặc CRON_SECRET."
            exit 1
          fi
          base="${APP_URL%/}"
          curl -fsS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${base}/api/cron/check-views"